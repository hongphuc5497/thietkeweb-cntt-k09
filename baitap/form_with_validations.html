<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Biểu mẫu nhập CV cá nhân - CNTT K09</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="form_with_validations.css" />
	</head>
	<body>
		<main class="wrap">
			<form class="cv-form" novalidate>
				<h1>BIỂU MẪU NHẬP CV CÁ NHÂN</h1>

				<div class="field">
					<label for="fullName">Họ và tên <span class="required">*</span></label>
					<input id="fullName" name="fullName" type="text" class="control" placeholder="Nhập họ và tên đầy đủ" aria-describedby="fullName-error" />
					<small id="fullName-error" class="error"></small>
				</div>

				<div class="field">
					<label for="email">Email liên hệ <span class="required">*</span></label>
					<input id="email" name="email" type="email" class="control" placeholder="example@domain.com" aria-describedby="email-error" />
					<small id="email-error" class="error"></small>
				</div>

				<div class="field">
					<label for="phone">Số điện thoại <span class="required">*</span></label>
					<input id="phone" name="phone" type="tel" class="control" placeholder="Ví dụ: 0912345678" aria-describedby="phone-error" />
					<small id="phone-error" class="error"></small>
				</div>

				<div class="field">
					<label id="position-label" for="position-trigger">Vị trí ứng tuyển <span class="required">*</span></label>
					<div class="select">
						<input name="position" type="hidden" />
						<button
							id="position-trigger"
							type="button"
							class="control select-trigger"
							aria-haspopup="listbox"
							aria-expanded="false"
							aria-labelledby="position-label position-trigger"
							aria-describedby="position-error"
						>
							<span class="select-value">-- Chọn vị trí --</span>
							<span class="select-arrow">&#9660;</span>
						</button>
						<ul class="select-options" role="listbox" aria-labelledby="position-label" hidden>
							<li role="option" tabindex="-1" aria-selected="false">Frontend Developer</li>
							<li role="option" tabindex="-1" aria-selected="false">Backend Developer</li>
							<li role="option" tabindex="-1" aria-selected="false">Fullstack Developer</li>
							<li role="option" tabindex="-1" aria-selected="false">UI/UX Designer</li>
							<li role="option" tabindex="-1" aria-selected="false">Tester</li>
						</ul>
					</div>
					<small id="position-error" class="error"></small>
				</div>

				<div class="field">
					<label for="experience">Tóm tắt kinh nghiệm làm việc <span class="required">*</span></label>
					<textarea id="experience" name="experience" class="control" placeholder="Mô tả sơ lược các công việc đã làm..." aria-describedby="experience-error"></textarea>
					<small id="experience-error" class="error"></small>
				</div>

				<div class="field">
					<label for="skills">Kỹ năng nổi bật <span class="required">*</span></label>
					<input id="skills" name="skills" type="text" class="control" placeholder="Ví dụ: HTML, CSS, JavaScript, Teamwork..." aria-describedby="skills-error" />
					<small id="skills-error" class="error"></small>
				</div>

				<button type="submit" class="submit-button">Gửi CV</button>

				<p class="success-message" role="status" hidden>Đã gửi CV thành công!</p>
			</form>
		</main>

		<footer class="footer">Bài tập Thiết kế web - Biểu mẫu có kiểm tra dữ liệu</footer>

		<script src="form_with_validations.js"></script>
	</body>
</html>
